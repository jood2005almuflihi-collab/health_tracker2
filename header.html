


<header class="site-header">
  <div class="header-content">

    <!-- شعار النظام -->
    <div class="brand">

      <div class="brand-logo">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 160 160"
          width="54"
          height="54"
          role="img"
          aria-label="شعار رعاية"
        >
          <defs>
            <linearGradient id="logoGradient"
              x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#9FBAA7"/>
              <stop offset="100%" stop-color="#648C77"/>
            </linearGradient>
          </defs>

          <circle
            cx="80" cy="80" r="75"
            fill="url(#logoGradient)"
          />

          <circle
            cx="80" cy="80" r="66"
            fill="none"
            stroke="#E8F1E9"
            stroke-opacity="0.55"
            stroke-width="1.5"
          />

          <!-- القلب -->
          <path
            d="
              M80 101
              C58 85 48 73 51 59
              C54 46 69 44 80 57
              C91 44 106 46 109 59
              C112 73 102 85 80 101Z
            "
            fill="#F9E5E5"
          />

          <!-- اليدان -->
          <path
            d="
              M33 89
              C43 82 52 83 62 91
              L77 103
              C82 108 86 109 91 105
              L104 95
              C110 90 119 92 125 97
              C113 115 98 125 80 127
              C60 125 44 109 33 89Z
            "
            fill="#FFFBF6"
          />

          <path
            d="M57 91 L76 106 M103 94 L88 106"
            fill="none"
            stroke="#D2E3D5"
            stroke-width="3"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <div class="brand-text">
        <h1>رعاية</h1>
        <p>عناية تجمعنا، وطمأنينة تدوم</p>
      </div>

    </div>

    <!-- أزرار الشريط العلوي -->
    <div class="header-actions">

      <!-- زر تسجيل الدخول -->
      <a href="login.html"
         class="login-header-btn">

        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 21a8 8 0 0 0-16 0"/>
          <circle cx="12" cy="8" r="4"/>
        </svg>

        <span>دخول</span>

      </a>

      <!-- زر الإشعارات -->
      <button
        class="notification-btn"
        type="button"
        aria-label="الإشعارات"
        title="الإشعارات"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M18 8a6 6 0 0 0-12 0
               c0 7-3 7-3 9h18
               c0-2-3-2-3-9"
          />
          <path d="M10 21h4"/>
        </svg>
      </button>

    </div>

  </div>
</header>
